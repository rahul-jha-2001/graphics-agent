# Policy served by OpenRouter instead of local vLLM. Usage:
#   export OPENROUTER_API_KEY=...            # never commit the key
#   graphics-agent probe    --config configs/model.openrouter.yaml
#   graphics-agent generate --config configs/model.openrouter.yaml --prompt "A red ball bounces twice and settles"
#   graphics-agent evaluate --config configs/model.openrouter.yaml --dataset tasks/eval.jsonl --workers 1
# Free models: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free (3B active, closest to Qwen-3B),
#   nvidia/nemotron-3.5-lightning:free, nvidia/nemotron-3.5-super-vl:free, nvidia/nemotron-3-ultra-550b-a55b:free
server:
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  max_model_len: 32768        # also the harness's history byte budget
  request_timeout: 120
  probe_max_tokens: 1024      # reasoning models think before calling the tool
  extra_body:
    reasoning: {effort: low}  # keep thinking short so tool calls fit the completion budget
harness:
  skill: skills/effectcraft/SKILL.md
  max_steps: 32
  max_tokens: 65536
  max_completion_tokens: 4096
  timeout: 600
  temperature: 0.7
  seed: 42

